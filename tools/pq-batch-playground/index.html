<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PQ Batch Playground — Ladder Script</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../shared/ladder-api.js?v=2"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg-primary: #ffffff;
  --bg-secondary: #f8f8f8;
  --bg-tertiary: #f0f0f0;
  --bg-panel: #ffffff;
  --bg-hover: #f0f0f0;
  --bg-active: #e8e8e8;
  --border: #e0e0e0;
  --border-light: #d0d0d0;
  --text-primary: #1a1a1a;
  --text-secondary: #666666;
  --text-dim: #999999;
  --amber: #d4950c;
  --amber-dim: #b8860b;
  --amber-glow: #d4950c20;
  --amber-bright: #e6a817;
  --green: #27ae60;
  --green-glow: #27ae6020;
  --red: #c0392b;
  --red-glow: #c0392b20;
  --blue: #2980b9;
  --cyan: #00bcd4;
  --cyan-glow: #00bcd420;
  --font-mono: 'IBM Plex Mono', 'Consolas', monospace;
  --font-display: 'Share Tech Mono', monospace;
}
html, body, #root { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-primary);
  background: var(--bg-primary);
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-secondary); }
::-webkit-scrollbar-thumb { background: var(--border); }
::-webkit-scrollbar-thumb:hover { background: var(--border-light); }

.pg-app { display: grid; grid-template-rows: 40px 1fr 22px; height: 100vh; overflow: hidden; }

.pg-header {
  display: flex; align-items: center; background: var(--bg-secondary);
  border-bottom: 1px solid var(--border); padding: 0 14px; gap: 14px; user-select: none;
}
.pg-title { font-family: var(--font-display); font-size: 13px; color: var(--cyan); letter-spacing: 2px; }
.pg-subtitle { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
.pg-divider { width: 1px; height: 18px; background: var(--border); }
.pg-header-actions { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.pg-btn {
  padding: 4px 10px; font-size: 10px; font-family: var(--font-mono); font-weight: 500;
  letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-secondary);
  background: var(--bg-tertiary); border: 1px solid var(--border); cursor: pointer;
  transition: all 0.12s;
}
.pg-btn:hover { color: var(--text-primary); background: var(--bg-hover); }
.pg-btn.primary { color: var(--amber); border-color: var(--amber-dim); }
.pg-btn.primary:hover { background: var(--amber-glow); }
.pg-btn.cyan { color: var(--cyan); border-color: var(--cyan); }
.pg-btn.cyan:hover { background: var(--cyan-glow); }
.pg-btn.green { color: var(--green); border-color: var(--green); }
.pg-btn.green:hover { background: var(--green-glow); }
.pg-btn.red { color: var(--red); border-color: var(--red); }
.pg-btn.red:hover { background: var(--red-glow); }
.pg-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.pg-main { display: grid; grid-template-columns: 320px 1fr 360px; overflow: hidden; }
.pg-left {
  background: var(--bg-panel); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 12px;
}
.pg-stage { overflow-y: auto; padding: 14px 20px; background: var(--bg-primary); }
.pg-right {
  background: var(--bg-secondary); border-left: 1px solid var(--border);
  overflow-y: auto; padding: 10px 14px;
}
.pg-footer {
  display: flex; align-items: center; background: var(--bg-secondary);
  border-top: 1px solid var(--border); padding: 0 14px; font-size: 10px;
  color: var(--text-dim); gap: 12px;
}

.pg-section { margin-bottom: 14px; }
.pg-section-title {
  font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  color: var(--cyan); margin-bottom: 8px; padding-bottom: 4px;
  border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
}
.pg-section-num {
  display: inline-block; width: 18px; height: 18px; line-height: 18px; text-align: center;
  background: var(--cyan); color: #fff; border-radius: 50%; font-size: 10px; font-weight: 700;
}
.pg-label { font-size: 9px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px; }

.utxo-card {
  background: var(--bg-secondary); border: 1px solid var(--border); padding: 6px 8px;
  margin-bottom: 4px; font-size: 11px; transition: all 0.12s;
}
.utxo-card.anchor { border-color: var(--cyan); background: var(--cyan-glow); }
.utxo-card.spent { opacity: 0.5; border-color: var(--green); }
.utxo-head {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px;
}
.utxo-label { font-weight: 600; color: var(--text-primary); }
.utxo-status {
  font-size: 9px; padding: 1px 5px; letter-spacing: 0.5px; text-transform: uppercase;
  border: 1px solid;
}
.status-pending { color: var(--text-dim); border-color: var(--text-dim); }
.status-funded { color: var(--blue); border-color: var(--blue); }
.status-anchor { color: var(--cyan); border-color: var(--cyan); }
.status-cache { color: var(--amber); border-color: var(--amber); }
.status-spent { color: var(--green); border-color: var(--green); }
.utxo-row {
  display: flex; justify-content: space-between; color: var(--text-secondary); font-size: 10px;
}
.utxo-row .val { color: var(--text-primary); font-family: var(--font-mono); }

.phase-panel {
  background: var(--bg-secondary); border: 1px solid var(--border); padding: 14px 18px; margin-bottom: 14px;
}
.phase-desc { font-size: 11px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 10px; }
.phase-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.field-row {
  display: grid; grid-template-columns: 130px 1fr; gap: 8px; margin-bottom: 6px;
  font-size: 11px; align-items: center;
}
.field-label { color: var(--text-secondary); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
.field-input {
  padding: 4px 7px; background: var(--bg-primary); border: 1px solid var(--border);
  color: var(--text-primary); font-family: var(--font-mono); font-size: 11px; outline: none; width: 100%;
}
.field-input:focus { border-color: var(--cyan); }
.field-input:disabled { background: var(--bg-tertiary); color: var(--text-dim); }

.metric-big { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
.metric-big-item { background: var(--bg-primary); border: 1px solid var(--border); padding: 8px 10px; }
.metric-big-label { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
.metric-big-val { font-size: 14px; color: var(--cyan); font-weight: 600; font-family: var(--font-display); }
.metric-big-sub { font-size: 9px; color: var(--text-dim); margin-top: 2px; }

.metric-table { width: 100%; font-size: 10px; border-collapse: collapse; margin-bottom: 8px; }
.metric-table th {
  text-align: left; padding: 4px 6px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border);
  font-size: 9px; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-dim); font-weight: 600;
}
.metric-table td {
  padding: 3px 6px; border-bottom: 1px solid var(--border-light); color: var(--text-primary); font-family: var(--font-mono);
}
.metric-table td.num { text-align: right; }
.metric-table tr:hover td { background: var(--bg-hover); }

.log-panel { background: var(--bg-primary); border: 1px solid var(--border); margin-top: 10px; }
.log-row {
  font-size: 10px; padding: 3px 8px; border-bottom: 1px solid var(--border-light);
  display: flex; gap: 8px; align-items: baseline;
}
.log-time { color: var(--text-dim); font-size: 9px; min-width: 56px; }
.log-msg { flex: 1; word-break: break-word; }
.log-row.err .log-msg { color: var(--red); }
.log-row.ok .log-msg { color: var(--green); }
.log-row.info .log-msg { color: var(--text-primary); }

.json-panel { background: var(--bg-secondary); border: 1px solid var(--border); margin-top: 6px; font-size: 10px; }
.json-panel-head { display: flex; align-items: center; justify-content: space-between; padding: 5px 8px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
.json-panel-head:hover { background: var(--bg-hover); }
.json-panel-title { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--text-primary); }
.json-panel-body { padding: 8px; overflow-x: auto; max-height: 300px; overflow-y: auto; }
.json-panel-body pre { font-size: 10px; font-family: var(--font-mono); white-space: pre-wrap; word-break: break-all; }
.btn-mini { padding: 1px 6px; font-size: 9px; font-family: var(--font-mono); background: var(--bg-primary); border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; }
.btn-mini:hover { color: var(--text-primary); border-color: var(--cyan); }

.banner {
  padding: 10px 14px; margin-bottom: 12px; border: 1px solid; font-size: 11px; line-height: 1.5;
}
.banner.amber { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-glow); }
.banner.cyan { color: var(--cyan); border-color: var(--cyan); background: var(--cyan-glow); }

.range-row {
  display: grid; grid-template-columns: 70px 1fr 50px; gap: 8px; align-items: center;
  margin-bottom: 8px; font-size: 11px;
}
.status-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-dim); margin-right: 6px;
}
.status-dot.online { background: var(--green); }
.status-dot.offline { background: var(--red); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useReducer, useMemo, useCallback } = React;

const { apiCallBase, makeApiCall } = window.LadderAPI;

// ────────────────────────────────────────────────────────────
// Constants
// ────────────────────────────────────────────────────────────
const MIN_N = 2;
// MAX_RUNGS = 16 in serialize.h caps a single createrungtx tx at 16 rungs
// in its conditions tree. We fund N PQ_BATCH UTXOs in one tx (one rung per
// output_index), so N is bound by that consensus limit. Stress runs in
// feature_rung_pq_batch_stress.py go higher by funding via N separate txs.
const MAX_N = 16;
const DEFAULT_N = 5;

// Per-input baseline (vB) for SIG(FALCON-512) — N independent FALCON-512
// signature inputs without batching. Per the current PQ_BATCH spec
// (~400 vB/input is the rounded baseline; the live stress test
// test/functional/feature_rung_pq_batch_stress.py confirms this within
// a few vB at N=100).
const SIG_FALCON_BASELINE_VB_PER_INPUT = 400;

// Per-input cost model under PQ_BATCH (post-v0.7 measurements):
//   Anchor input  ≈ 392 vB total per-input (witness PUBKEY 897 + SIG 666
//                   + framing, segwit-discounted). Paid once per commit
//                   per tx.
//   Cache input   ≈ 14 vB total per-input (just the MLSC proof
//                   scaffolding; signature verify short-circuits via
//                   tx-local cache).
// Asymptote at large N: cache cost dominates → ~14 vB/input.
const ANCHOR_PER_INPUT_VB = 392;
const CACHE_PER_INPUT_VB = 14;

// Per-PQ_BATCH-UTXO funding amount. Kept small so a single signet faucet
// call (default 0.001 BTC = 100,000 sats) covers N up to 10 with headroom
// for tx fee. The 300s per-IP faucet cooldown means a single click on
// "Top up wallet" must produce enough headroom for the whole batch.
const FUND_PER_UTXO_SATS = 5000;  // 0.00005 BTC each

// ────────────────────────────────────────────────────────────
// Helpers
// ────────────────────────────────────────────────────────────
const shortHex = (hex, n) => !hex ? '—' : (hex.length > (n || 12) ? hex.slice(0, n || 12) + '…' : hex);
const fmtSats = (n) => (n === null || n === undefined) ? '—' : n.toLocaleString() + ' sats';
const fmtVb = (n) => (n === null || n === undefined) ? '—' : n.toLocaleString() + ' vB';

async function sha256Hex(hex) {
  const bytes = new Uint8Array(hex.match(/.{2}/g).map(b => parseInt(b, 16)));
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// createrungtx rungs shape: one rung per (output_index, condition). For N
// PQ_BATCH outputs sharing one commit, emit N rungs all with the same
// PQ_BATCH(commit) gate. signrungtx takes the SAME N-rung tree at spend
// time (with output_index per rung) so it can reconstruct the MLSC
// Merkle proof correctly — passing a single-rung conditions array would
// mismatch the fund-time tree and fail leaf verification. Per-input
// `signerEntry.rung = vout` tells signrungtx which leaf to reveal.
const buildPqBatchRungsForCreate = (commitHex, n = 1) => Array.from({ length: n }, (_, i) => ({
  output_index: i,
  blocks: [{ type: 'PQ_BATCH', fields: [{ type: 'HASH256', hex: commitHex }] }],
}));

const buildPqBatchRungsForSign = (commitHex, n = 1) => Array.from({ length: n }, (_, i) => ({
  output_index: i,
  blocks: [{ type: 'PQ_BATCH', fields: [{ type: 'HASH256', hex: commitHex }] }],
}));

// ────────────────────────────────────────────────────────────
// State + reducer
// ────────────────────────────────────────────────────────────
const initialState = {
  online: false,
  blocks: 0,
  n: DEFAULT_N,
  scheme: 'FALCON512',
  // Lifecycle: 'idle' | 'keygen' | 'funding' | 'funded' | 'spending' | 'spent'
  phase: 'idle',
  busy: false,
  // FALCON keypair + commit
  pqKey: null,         // { pubkey, privkey, scheme, commitHex }
  // Funded UTXOs: [{ txid, vout, amount_sats, spk, fundTxVsize }]
  utxos: [],
  // Spend tx artifacts
  spendTx: {
    unsignedHex: null,
    signedHex: null,
    txid: null,
    vsize: null,
    weight: null,
    accepted: null,
    rejectReason: null,
  },
  // Live measurements
  metrics: null,
  // Captured request/response JSONs from each stage, surfaced in the
  // inspector so the user can copy/download what hit the proxy.
  lastJsons: [],   // [{ id, title, json }]
  log: [],
};

function reducer(state, action) {
  switch (action.type) {
    case 'ONLINE': return { ...state, online: action.online, blocks: action.blocks };
    case 'SET_N': return { ...state, n: action.n };
    case 'SET_SCHEME': return { ...state, scheme: action.scheme };
    case 'SET_PHASE': return { ...state, phase: action.phase };
    case 'SET_BUSY': return { ...state, busy: action.busy };
    case 'SET_PQ_KEY': return { ...state, pqKey: action.key };
    case 'SET_UTXOS': return { ...state, utxos: action.utxos };
    case 'PATCH_SPEND': return { ...state, spendTx: { ...state.spendTx, ...action.patch } };
    case 'SET_METRICS': return { ...state, metrics: action.metrics };
    case 'LOG': return {
      ...state,
      log: [...state.log, { msg: action.msg, cls: action.cls || 'info', time: new Date().toLocaleTimeString() }].slice(-200),
    };
    case 'CLEAR_LOG': return { ...state, log: [] };
    case 'STORE_JSON': {
      const filtered = state.lastJsons.filter(e => e.id !== action.id);
      return { ...state, lastJsons: [...filtered, { id: action.id, title: action.title, json: action.json }] };
    }
    case 'RESET': return { ...initialState, online: state.online, blocks: state.blocks, n: state.n };
    default: return state;
  }
}

// ────────────────────────────────────────────────────────────
// App
// ────────────────────────────────────────────────────────────
function App() {
  const [state, dispatch] = useReducer(reducer, initialState);
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(null);
  const apiCall = useMemo(() => makeApiCall({ setLoading, setError }), []);

  const log = useCallback((msg, cls) => dispatch({ type: 'LOG', msg, cls }), []);
  const storeJson = useCallback((id, title, json) => dispatch({ type: 'STORE_JSON', id, title, json }), []);

  // Poll status every 5s.
  useEffect(() => {
    let cancelled = false;
    const tick = async () => {
      try {
        const s = await apiCallBase('/api/ladder/status');
        if (!cancelled) dispatch({ type: 'ONLINE', online: s?.status === 'ok', blocks: s?.blocks || 0 });
      } catch {
        if (!cancelled) dispatch({ type: 'ONLINE', online: false, blocks: 0 });
      }
    };
    tick();
    const id = setInterval(tick, 5000);
    return () => { cancelled = true; clearInterval(id); };
  }, []);

  // ── Action: generate FALCON keypair ──────────────────────
  const handleGenKey = useCallback(async () => {
    dispatch({ type: 'SET_BUSY', busy: true });
    dispatch({ type: 'SET_PHASE', phase: 'keygen' });
    log('Generating ' + state.scheme + ' keypair...');
    const kp = await apiCall('/api/ladder/pq/keypair', { scheme: state.scheme });
    if (!kp) { log('keypair generation failed', 'err'); dispatch({ type: 'SET_BUSY', busy: false }); return; }
    const commit = await sha256Hex(kp.pubkey);
    dispatch({ type: 'SET_PQ_KEY', key: { ...kp, commitHex: commit } });
    storeJson('pq_keypair', 'PQ keypair (/api/ladder/pq/keypair)',
      { scheme: kp.scheme, pubkey: kp.pubkey, privkey: kp.privkey, sha256_commit: commit });
    log('FALCON pubkey ' + (kp.pubkey.length / 2) + ' B, commit=' + shortHex(commit, 16), 'ok');
    dispatch({ type: 'SET_PHASE', phase: 'idle' });
    dispatch({ type: 'SET_BUSY', busy: false });
  }, [apiCall, log, state.scheme]);

  // ── Action: fund N PQ_BATCH UTXOs from the wallet ─────────
  //
  // Two-step flow that mirrors the engine's wallet-funded path:
  //
  //  1. Ask the wallet to sendtoaddress an EXACT amount to a self
  //     address. Bitcoin Core's wallet handles coin selection + change
  //     automatically — no risk of donating a 50 BTC UTXO to fees just
  //     because createrungtx has no auto-change. Result: a small,
  //     known-size UTXO under our control.
  //
  //  2. Use that UTXO as the single input to createrungtx, producing N
  //     PQ_BATCH outputs all gated by the same commit (one rung per
  //     output_index, so N ≤ MAX_RUNGS=16).
  const handleFund = useCallback(async () => {
    if (!state.pqKey) { log('generate a FALCON keypair first', 'err'); return; }
    dispatch({ type: 'SET_BUSY', busy: true });
    dispatch({ type: 'SET_PHASE', phase: 'funding' });

    const perOutSats = FUND_PER_UTXO_SATS;
    const fundTxFeeBudget = 2000;  // generous; actual fee for a single-input N-output v4 tx is much less
    const sourceSats = perOutSats * state.n + fundTxFeeBudget;

    // Step 1: get a self address and pull `sourceSats` from the wallet.
    log('Requesting wallet → self ' + sourceSats + ' sats (' + state.n + ' × ' + perOutSats + ' + ' + fundTxFeeBudget + ' fee)...');
    const addr = await apiCall('/api/ladder/wallet/address');
    if (!addr || !addr.address) { log('wallet/address failed', 'err'); dispatch({ type: 'SET_BUSY', busy: false }); return; }
    const sent = await apiCall('/api/ladder/wallet/sendtoaddress', {
      address: addr.address, amount_sats: sourceSats,
    });
    if (!sent || !sent.txid) { log('wallet/sendtoaddress failed', 'err'); dispatch({ type: 'SET_BUSY', busy: false }); return; }
    log('source UTXO: ' + shortHex(sent.txid, 14) + ':' + sent.vout + ' (' + sourceSats + ' sats)', 'ok');

    // Mine so the source UTXO is confirmed before the fund tx spends it.
    await apiCall('/api/ladder/mine', { blocks: 1 }, true);

    // Step 2: build createrungtx with N PQ_BATCH outputs.
    log('Building fund tx — 1 input → ' + state.n + ' PQ_BATCH UTXOs...');
    const rungsForCreate = buildPqBatchRungsForCreate(state.pqKey.commitHex, state.n);
    const outputAmounts = Array(state.n).fill(perOutSats / 1e8);
    const fundCreateReq = {
      inputs: [{ txid: sent.txid, vout: sent.vout }],
      outputs: outputAmounts,
      rungs: rungsForCreate,
    };
    storeJson('fund_create_req', 'fund createrungtx request', fundCreateReq);
    const created = await apiCall('/api/ladder/createrungtx', fundCreateReq);
    if (!created || !created.hex) { log('createrungtx failed', 'err'); dispatch({ type: 'SET_BUSY', busy: false }); return; }
    storeJson('fund_create_resp', 'fund createrungtx response', created);
    const signed = await apiCall('/api/ladder/sign', { hex: created.hex });
    if (!signed || !signed.hex) { log('wallet sign of fund tx failed', 'err'); dispatch({ type: 'SET_BUSY', busy: false }); return; }
    const bcast = await apiCall('/api/ladder/broadcast', { hex: signed.hex });
    if (!bcast || !bcast.txid) { log('broadcast of fund tx failed', 'err'); dispatch({ type: 'SET_BUSY', busy: false }); return; }
    await apiCall('/api/ladder/mine', { blocks: 1 }, true);
    storeJson('fund_signed_tx', 'fund tx (signed hex + txid)',
      { txid: bcast.txid, hex: signed.hex, vouts: state.n,
        per_output_sats: perOutSats, source_utxo: { txid: sent.txid, vout: sent.vout, sats: sourceSats } });

    // All N outputs share the same scriptPubKey (0xDF + conditions_root).
    const sharedSpk = created.scriptPubKey;
    const utxos = [];
    for (let i = 0; i < state.n; i++) {
      utxos.push({ txid: bcast.txid, vout: i, amount_sats: perOutSats, spk: sharedSpk });
    }
    log('fund tx mined: ' + shortHex(bcast.txid, 14) + ', ' + state.n + ' vouts × ' + perOutSats + ' sats', 'ok');

    dispatch({ type: 'SET_UTXOS', utxos });
    dispatch({ type: 'SET_PHASE', phase: 'funded' });
    dispatch({ type: 'SET_BUSY', busy: false });
  }, [apiCall, log, state.pqKey, state.n]);

  // ── Action: build + sign + broadcast batch spend ─────────
  const handleSpend = useCallback(async () => {
    if (state.utxos.length === 0) { log('fund UTXOs first', 'err'); return; }
    if (!state.pqKey) { log('missing PQ key', 'err'); return; }
    dispatch({ type: 'SET_BUSY', busy: true });
    dispatch({ type: 'SET_PHASE', phase: 'spending' });
    log('Building batch spend tx (' + state.utxos.length + ' inputs, anchor=0)...');

    // Sink output: single PQ_BATCH-gated MLSC output (same commit).
    const rungsForCreate = buildPqBatchRungsForCreate(state.pqKey.commitHex, 1);
    // Spend-side conditions: must mirror the FUND tree (N rungs with
    // output_index per rung) so signrungtx can reconstruct the Merkle
    // proof. signerEntry.rung = vout selects which leaf each input reveals.
    const rungsForSign = buildPqBatchRungsForSign(state.pqKey.commitHex, state.utxos.length);
    const totalIn = state.utxos.reduce((s, u) => s + u.amount_sats, 0);
    // Generous fee — 5000 sats covers any plausible tx size at N≤20.
    const sinkSats = totalIn - 5000;
    const sinkBtc = sinkSats / 1e8;

    const createReq = {
      inputs: state.utxos.map(u => ({ txid: u.txid, vout: u.vout })),
      outputs: [sinkBtc],
      rungs: rungsForCreate,
    };
    storeJson('spend_create_req', 'spend createrungtx request', createReq);
    const created = await apiCall('/api/ladder/createrungtx', createReq);
    if (!created || !created.hex) { log('createrungtx failed', 'err'); dispatch({ type: 'SET_BUSY', busy: false }); return; }
    storeJson('spend_create_resp', 'spend createrungtx response', created);
    dispatch({ type: 'PATCH_SPEND', patch: { unsignedHex: created.hex } });

    // Anchor at index 0 (full witness), siblings at 1..N-1 (empty witness).
    // `rung: u.vout` tells signrungtx which leaf in the N-rung tree to
    // reveal for each input — matches the fund tx's per-vout output_index.
    const signers = [{
      input: 0,
      rung: state.utxos[0].vout,
      blocks: [{
        type: 'PQ_BATCH',
        scheme: state.pqKey.scheme,
        pq_pubkey: state.pqKey.pubkey,
        pq_privkey: state.pqKey.privkey,
      }],
      conditions: rungsForSign,
    }];
    for (let i = 1; i < state.utxos.length; i++) {
      signers.push({
        input: i, rung: state.utxos[i].vout,
        blocks: [{ type: 'PQ_BATCH' }], conditions: rungsForSign,
      });
    }
    const spentOutputs = state.utxos.map(u => ({
      amount: (u.amount_sats / 1e8).toFixed(8),
      scriptPubKey: u.spk,
    }));

    log('Signing — 1 anchor (FALCON sign) + ' + (state.utxos.length - 1) + ' cache reads...');
    const signReq = { hex: created.hex, signers, spent_outputs: spentOutputs };
    storeJson('spend_sign_req', 'spend signrungtx request', signReq);
    const signed = await apiCall('/api/ladder/sign', signReq);
    if (!signed || !signed.hex) { log('signrungtx failed', 'err'); dispatch({ type: 'SET_BUSY', busy: false }); return; }

    const decoded = await apiCall('/api/ladder/decode-tx', { hex: signed.hex });
    const vsize = decoded?.vsize || 0;
    const weight = decoded?.weight || 0;
    storeJson('spend_signed_tx', 'spend tx (signed hex + decoded)',
      { hex: signed.hex, vsize, weight, decoded });
    log('Signed: ' + vsize + ' vB (weight ' + weight + ' wu)', 'ok');

    const bcast = await apiCall('/api/ladder/broadcast', { hex: signed.hex });
    const accepted = !!(bcast && bcast.txid);
    if (accepted) {
      log('Broadcast: ' + bcast.txid, 'ok');
      storeJson('spend_broadcast', 'spend broadcast result', bcast);
      await apiCall('/api/ladder/mine', { blocks: 1 }, true);
    } else {
      log('Broadcast rejected', 'err');
    }

    const baselineVb = state.utxos.length * SIG_FALCON_BASELINE_VB_PER_INPUT;
    const perInput = vsize / state.utxos.length;
    const savings = baselineVb / vsize;
    dispatch({ type: 'PATCH_SPEND', patch: {
      signedHex: signed.hex,
      txid: bcast?.txid || null,
      vsize, weight, accepted,
      rejectReason: bcast?.detail || null,
    }});
    dispatch({ type: 'SET_METRICS', metrics: {
      vsize, weight, perInput, baselineVb, savings,
      anchorPayload: ANCHOR_PER_INPUT_VB,
      cachePayload: CACHE_PER_INPUT_VB,
    }});
    dispatch({ type: 'SET_PHASE', phase: 'spent' });
    dispatch({ type: 'SET_BUSY', busy: false });
  }, [apiCall, log, state.utxos, state.pqKey]);

  const handleReset = useCallback(() => {
    dispatch({ type: 'RESET' });
    log('reset');
  }, [log]);

  return (
    <div className="pg-app">
      <Header state={state} onReset={handleReset} />
      <div className="pg-main">
        <LeftPanel state={state} dispatch={dispatch}
                   onGenKey={handleGenKey} onFund={handleFund} onSpend={handleSpend} />
        <StagePanel state={state} error={error} loading={loading} onReset={handleReset} />
        <RightPanel state={state} />
      </div>
      <Footer state={state} />
    </div>
  );
}

function Header({ state, onReset }) {
  return (
    <div className="pg-header">
      <div className="pg-title">PQ BATCH PLAYGROUND</div>
      <div className="pg-subtitle">N-input cache amortisation · FALCON-512 · TX_MLSC v4</div>
      <div className="pg-divider" />
      <div style={{ display: 'flex', alignItems: 'center', gap: 4, fontSize: 10 }}>
        <span className={'status-dot ' + (state.online ? 'online' : 'offline')} />
        {state.online ? ('chain @ ' + state.blocks) : 'offline'}
      </div>
      <div className="pg-header-actions">
        <a href="../ladder-engine.html" style={{ fontSize: 10, color: 'var(--text-dim)', textDecoration: 'none' }}>← Engine</a>
        <button className="pg-btn" onClick={onReset}>RESET</button>
      </div>
    </div>
  );
}

function LeftPanel({ state, dispatch, onGenKey, onFund, onSpend }) {
  return (
    <div className="pg-left">
      <div className="pg-section">
        <div className="pg-section-title"><span className="pg-section-num">1</span> CONFIGURE</div>
        <div className="range-row">
          <span className="field-label">Inputs N</span>
          <input type="range" min={MIN_N} max={MAX_N} value={state.n}
                 disabled={state.busy || state.utxos.length > 0}
                 onChange={(e) => dispatch({ type: 'SET_N', n: parseInt(e.target.value) })} />
          <span style={{ fontFamily: 'var(--font-display)', color: 'var(--cyan)' }}>{state.n}</span>
        </div>
        <div className="field-row">
          <span className="field-label">Scheme</span>
          <select className="field-input" value={state.scheme}
                  disabled={state.busy || state.pqKey != null}
                  onChange={(e) => dispatch({ type: 'SET_SCHEME', scheme: e.target.value })}>
            <option value="FALCON512">FALCON-512 (897 B pk, 666 B sig)</option>
            <option value="FALCON1024">FALCON-1024 (1793 B pk, 1280 B sig)</option>
            <option value="DILITHIUM3">Dilithium3 (1952 B pk, 3293 B sig)</option>
          </select>
        </div>
      </div>

      <div className="pg-section">
        <div className="pg-section-title"><span className="pg-section-num">2</span> KEY + COMMIT</div>
        <div className="field-row">
          <span className="field-label">PQ pubkey</span>
          <input className="field-input" readOnly value={shortHex(state.pqKey?.pubkey, 26)} />
        </div>
        <div className="field-row">
          <span className="field-label">SHA256 commit</span>
          <input className="field-input" readOnly value={shortHex(state.pqKey?.commitHex, 26)} />
        </div>
        <button className="pg-btn cyan" disabled={state.busy || state.pqKey != null} onClick={onGenKey}>
          Generate {state.scheme}
        </button>
      </div>

      <div className="pg-section">
        <div className="pg-section-title"><span className="pg-section-num">3</span> FUND POOL</div>
        <div style={{ fontSize: 10, color: 'var(--text-secondary)', marginBottom: 8, lineHeight: 1.5 }}>
          Wallet pulls {(FUND_PER_UTXO_SATS * state.n / 1e8).toFixed(5)} BTC + 2,000 sats fee into a self UTXO,
          then one createrungtx splits it across {state.n} PQ_BATCH vouts ({FUND_PER_UTXO_SATS} sats each)
          all gated by the same commit. Bitcoin Core's wallet handles change automatically — no wallet
          balance is wasted to fees.
        </div>
        <button className="pg-btn primary" disabled={state.busy || !state.pqKey || state.utxos.length > 0} onClick={onFund}>
          Fund {state.n} UTXOs from wallet
        </button>
      </div>

      <div className="pg-section">
        <div className="pg-section-title"><span className="pg-section-num">4</span> BATCH SPEND</div>
        <div style={{ fontSize: 10, color: 'var(--text-secondary)', marginBottom: 8, lineHeight: 1.5 }}>
          Drain all {state.n} UTXOs into one sink. Input 0 = anchor (PUBKEY + FALCON sig).
          Inputs 1..{state.n - 1} = empty PQ_BATCH witness (cache reads).
        </div>
        <button className="pg-btn green" disabled={state.busy || state.utxos.length === 0 || state.spendTx.signedHex} onClick={onSpend}>
          Build + Sign + Broadcast
        </button>
      </div>

      <div className="pg-section">
        <div className="pg-section-title">UTXO POOL ({state.utxos.length}/{state.n})</div>
        {state.utxos.length === 0
          ? <div style={{ fontSize: 10, color: 'var(--text-dim)' }}>(none yet)</div>
          : state.utxos.map((u, i) => (
              <div key={i} className={'utxo-card ' + (state.spendTx.accepted ? 'spent' : (i === 0 ? 'anchor' : ''))}>
                <div className="utxo-head">
                  <span className="utxo-label">#{i} {i === 0 ? '(anchor)' : '(cache)'}</span>
                  <span className={'utxo-status ' + (state.spendTx.accepted ? 'status-spent' : (i === 0 ? 'status-anchor' : 'status-cache'))}>
                    {state.spendTx.accepted ? 'spent' : (i === 0 ? 'anchor' : 'cache')}
                  </span>
                </div>
                <div className="utxo-row">
                  <span>txid</span><span className="val">{shortHex(u.txid, 14)}</span>
                </div>
                <div className="utxo-row">
                  <span>amount</span><span className="val">{fmtSats(u.amount_sats)}</span>
                </div>
              </div>
            ))}
      </div>
    </div>
  );
}

function StagePanel({ state, error, loading, onReset }) {
  const phaseDesc = {
    idle:    'Ready. Configure N, generate the PQ key, then fund + spend.',
    keygen:  'Generating FALCON keypair via /api/ladder/pq/keypair...',
    funding: 'Funding ' + state.n + ' PQ_BATCH UTXOs sharing one commit. Each is its own createrungtx + wallet sign + broadcast + mine cycle.',
    funded:  'Pool of ' + state.utxos.length + ' UTXOs is on-chain. Each is gated by SHA256(pq_pubkey). Run the batch spend to demonstrate the anchor + cache pattern.',
    spending:'Building the spend tx (' + state.utxos.length + ' inputs → 1 sink). Anchor at input 0 reveals pubkey + FALCON sig; siblings have empty PQ_BATCH witness.',
    spent:   'Done. The single FALCON verify on the anchor populated a tx-local cache; consensus satisfied every other input by cache lookup. Compare the measurement vs N×SIG(FALCON).',
  };

  return (
    <div className="pg-stage">
      {error && (
        <div className="banner amber">
          <strong>ERROR:</strong> {String(error)}
        </div>
      )}
      {!state.online && (
        <div className="banner amber">
          Proxy is offline. Start the Ladder proxy and a regtest/signet bitcoind, then refresh.
        </div>
      )}
      <div className="banner cyan">
        <strong>What this is:</strong> a focused demo of PQ_BATCH (wire ID 0x0A03). Funds N UTXOs sharing one FALCON-512 pubkey commit, then drains them in a single tx where ONE input ("anchor") reveals the pubkey + sig and the rest validate from a tx-local cache. Per-input cost asymptotes to ~14 vB vs ~400 vB for independent FALCON sigs (~28× saving at the asymptote; ~22× at N=100; ~8× at N=10).
      </div>

      <div className="phase-panel">
        <div style={{ fontSize: 10, color: 'var(--text-dim)', textTransform: 'uppercase', letterSpacing: 1, marginBottom: 6 }}>
          Phase: {state.phase}
        </div>
        <div className="phase-desc">{phaseDesc[state.phase] || ''}</div>
        {loading && (
          <div style={{ fontSize: 10, color: 'var(--cyan)' }}>… {loading}</div>
        )}
      </div>

      {state.spendTx.signedHex && (
        <div className="phase-panel">
          <div className="pg-section-title" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span>SPEND TX</span>
            <button className="pg-btn green" onClick={onReset}>Start over</button>
          </div>
          <div className="field-row">
            <span className="field-label">txid</span>
            <input className="field-input" readOnly value={state.spendTx.txid || '(not broadcast)'} />
          </div>
          <div className="field-row">
            <span className="field-label">vsize</span>
            <input className="field-input" readOnly value={state.spendTx.vsize + ' vB'} />
          </div>
          <div className="field-row">
            <span className="field-label">weight</span>
            <input className="field-input" readOnly value={state.spendTx.weight + ' wu'} />
          </div>
          <div className="field-row">
            <span className="field-label">accepted</span>
            <input className="field-input" readOnly value={state.spendTx.accepted ? 'yes' : 'no'} />
          </div>
        </div>
      )}

      <JsonInspector entries={state.lastJsons} />
      <LogPanel log={state.log} />
    </div>
  );
}

function JsonInspector({ entries }) {
  const [openId, setOpenId] = useState(null);
  const [copiedId, setCopiedId] = useState(null);
  if (!entries || entries.length === 0) return null;
  const copy = (id, json) => {
    try {
      navigator.clipboard.writeText(JSON.stringify(json, null, 2));
      setCopiedId(id);
      setTimeout(() => setCopiedId(prev => prev === id ? null : prev), 1500);
    } catch {}
  };
  const downloadAll = () => {
    const payload = {
      exported_at: new Date().toISOString(),
      entries: Object.fromEntries(entries.map(e => [e.id, { title: e.title, json: e.json }])),
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'pq-batch-' + new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-') + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  return (
    <div style={{ marginTop: 12 }}>
      <div className="pg-section-title" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <span>JSON INSPECTOR ({entries.length})</span>
        <button className="btn-mini" onClick={downloadAll}>Download all</button>
      </div>
      {entries.map(item => (
        <div key={item.id} className="json-panel">
          <div className="json-panel-head" onClick={() => setOpenId(openId === item.id ? null : item.id)}>
            <span className="json-panel-title">{item.title}</span>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <button className="btn-mini" onClick={(e) => { e.stopPropagation(); copy(item.id, item.json); }}>
                {copiedId === item.id ? '✓ copied' : 'copy'}
              </button>
              <span style={{ fontSize: 10, color: 'var(--text-dim)' }}>{openId === item.id ? '▼' : '▶'}</span>
            </span>
          </div>
          {openId === item.id && (
            <div className="json-panel-body">
              <pre>{JSON.stringify(item.json, null, 2)}</pre>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function RightPanel({ state }) {
  const m = state.metrics;
  return (
    <div className="pg-right">
      <div className="pg-section-title">LIVE METRICS</div>
      <div className="metric-big">
        <div className="metric-big-item">
          <div className="metric-big-label">tx vsize</div>
          <div className="metric-big-val">{m ? m.vsize.toLocaleString() : '—'}</div>
          <div className="metric-big-sub">vB (segwit)</div>
        </div>
        <div className="metric-big-item">
          <div className="metric-big-label">per input</div>
          <div className="metric-big-val">{m ? m.perInput.toFixed(1) : '—'}</div>
          <div className="metric-big-sub">vB / input</div>
        </div>
      </div>
      <div className="metric-big">
        <div className="metric-big-item">
          <div className="metric-big-label">SIG(FALCON) baseline</div>
          <div className="metric-big-val" style={{ color: 'var(--text-primary)' }}>{m ? m.baselineVb.toLocaleString() : '—'}</div>
          <div className="metric-big-sub">N × {SIG_FALCON_BASELINE_VB_PER_INPUT} vB (no batching)</div>
        </div>
        <div className="metric-big-item">
          <div className="metric-big-label">savings</div>
          <div className="metric-big-val" style={{ color: 'var(--green)' }}>{m ? m.savings.toFixed(2) + '×' : '—'}</div>
          <div className="metric-big-sub">vs independent FALCON sigs</div>
        </div>
      </div>

      <div className="pg-section">
        <div className="pg-label">Cost breakdown (model)</div>
        <table className="metric-table">
          <thead>
            <tr><th>Slot</th><th className="num">vB</th><th className="num">N=∞ asymptote</th></tr>
          </thead>
          <tbody>
            <tr>
              <td>Anchor input</td>
              <td className="num">{m ? m.anchorPayload : '~392'}</td>
              <td className="num">≈ 392</td>
            </tr>
            <tr>
              <td>Cache input × {Math.max(0, state.n - 1)}</td>
              <td className="num">{m ? m.cachePayload : '~14'}</td>
              <td className="num">≈ 14 each</td>
            </tr>
            <tr>
              <td><strong>Per input (mean)</strong></td>
              <td className="num"><strong>{m ? m.perInput.toFixed(1) : '—'}</strong></td>
              <td className="num"><strong>≈ 14</strong></td>
            </tr>
          </tbody>
        </table>
      </div>

      {state.pqKey && (
        <div className="pg-section">
          <div className="pg-label">FALCON key</div>
          <table className="metric-table">
            <tbody>
              <tr><td>scheme</td><td>{state.pqKey.scheme}</td></tr>
              <tr><td>pubkey size</td><td>{state.pqKey.pubkey.length / 2} B</td></tr>
              <tr><td>commit (hex)</td><td>{shortHex(state.pqKey.commitHex, 18)}</td></tr>
            </tbody>
          </table>
        </div>
      )}

      <div className="pg-section" style={{ fontSize: 10, color: 'var(--text-dim)', lineHeight: 1.5 }}>
        Baseline {SIG_FALCON_BASELINE_VB_PER_INPUT} vB/input is the per-input
        cost of N independent SIG(FALCON-512) inputs without batching.
        This page caps N at {MAX_N} (one fund tx, MAX_RUNGS bound);
        the stress test <code>feature_rung_pq_batch_stress.py</code>
        goes higher by funding via N separate txs. Standard relay caps
        at ~1,810 PQ_BATCH inputs per spend tx (100K vB witness cap /
        ~14 vB cache cost + 1 anchor).
      </div>
    </div>
  );
}

function LogPanel({ log }) {
  if (!log || log.length === 0) return null;
  return (
    <div className="log-panel">
      <div style={{ padding: '6px 10px', fontSize: 9, color: 'var(--text-dim)', textTransform: 'uppercase', letterSpacing: 1, borderBottom: '1px solid var(--border)' }}>
        Activity log
      </div>
      <div style={{ maxHeight: 240, overflowY: 'auto' }}>
        {log.slice().reverse().map((row, i) => (
          <div key={i} className={'log-row ' + row.cls}>
            <span className="log-time">{row.time}</span>
            <span className="log-msg">{row.msg}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function Footer({ state }) {
  return (
    <div className="pg-footer">
      <span>PQ_BATCH wire 0x0A03 · evaluator: src/rung/blocks/qabi.cpp::EvalPQBatchBlock</span>
      <span style={{ marginLeft: 'auto' }}>n={state.n} · phase={state.phase} · utxos={state.utxos.length}</span>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
