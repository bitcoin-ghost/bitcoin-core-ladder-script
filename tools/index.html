<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ladder Script</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
// Set theme before first paint to avoid flash.
(function () {
  var t = localStorage.getItem('theme');
  if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.dataset.theme = t;
})();
</script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff;
  --bg-alt: #f5f5f5;
  --text: #1a1a1a;
  --text-body: #333333;
  --text-dim: #666666;
  --text-light: #999999;
  --accent: #e67e22;
  --accent-dark: #d35400;
  --border: #e0e0e0;
  --border-light: #eeeeee;
}
html[data-theme="dark"] {
  --bg: #0a0a0a;
  --bg-alt: #141414;
  --text: #ffffff;
  --text-body: #e0e0e0;
  --text-dim: #aaaaaa;
  --text-light: #777777;
  --border: #2a2a2a;
  --border-light: #1f1f1f;
}
html { scroll-behavior: smooth; }
body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text-body); line-height: 1.8; font-size: 15px; min-height: 100vh; display: flex; flex-direction: column; }
::selection { background: var(--accent); color: #fff; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* -- HEADER -- */
.site-header { background: var(--bg); border-bottom: 1px solid var(--border); padding: 0; }
.site-header-inner { max-width: 1100px; margin: 0 auto; padding: 0 32px; }
.header-top { display: flex; align-items: center; justify-content: space-between; height: 56px; }
.header-title { font-size: 16px; font-weight: 700; color: var(--text); text-decoration: none; }
.header-title:hover { text-decoration: none; color: var(--accent); }
.header-right { display: flex; align-items: center; gap: 16px; }
.header-right a { color: var(--text-dim); font-size: 13px; font-weight: 500; text-decoration: none; }
.header-right a:hover { color: var(--accent); }
.header-right .gh-icon { display: flex; align-items: center; color: var(--text-dim); }
.header-right .gh-icon:hover { color: var(--accent); }
.theme-toggle { background: none; border: none; cursor: pointer; color: var(--text-dim); display: flex; align-items: center; padding: 4px; border-radius: 4px; }
.theme-toggle:hover { color: var(--accent); }
.theme-toggle svg { display: block; }
html[data-theme="dark"] .theme-toggle .sun { display: block; }
html[data-theme="dark"] .theme-toggle .moon { display: none; }
html:not([data-theme="dark"]) .theme-toggle .sun { display: none; }
html:not([data-theme="dark"]) .theme-toggle .moon { display: block; }
.header-nav { display: flex; gap: 28px; border-top: 1px solid var(--border-light); padding-top: 10px; padding-bottom: 10px; }
.header-nav a { color: var(--text-dim); font-size: 13px; font-weight: 500; text-decoration: none; padding-bottom: 8px; }
.header-nav a:hover { color: var(--accent); text-decoration: none; }


/* -- HERO -- */
.hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 64px 32px; text-align: center; }
.hero-title { font-size: 72px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); margin-bottom: 24px; line-height: 1.05; }
.hero-title .accent { color: var(--accent); }
.hero-lede { font-size: 20px; color: var(--text-body); max-width: 720px; margin: 0 auto 16px; line-height: 1.6; }
.hero-stat { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; color: var(--text-dim); max-width: 720px; margin: 0 auto 32px; }
.hero-call { font-size: 16px; color: var(--text-dim); max-width: 680px; margin: 0 auto; line-height: 1.7; }
.hero-call a { font-weight: 500; }

/* -- FOOTER -- */
.site-footer { background: var(--bg-alt); border-top: 1px solid var(--border); padding: 24px 0; text-align: center; font-size: 13px; color: var(--text-light); }
.site-footer a { color: var(--text-light); }
.site-footer a:hover { color: var(--accent); }

@media (max-width: 600px) {
  .header-top { flex-direction: column; align-items: flex-start; gap: 8px; height: auto; padding: 12px 0; }
  .header-nav { flex-wrap: wrap; gap: 18px; }
  .site-header-inner { padding: 0 16px; }
  .hero-title { font-size: 48px; }
  .hero-lede { font-size: 17px; }
  .hero { padding: 48px 20px; }
}
</style>
</head>

        </button>

    <nav class="header-nav">
      <a href="ladder-script.html">Intro</a>

      <a href="block-docs/">Blocks</a>

      <a href="tools.html">Tools</a>
      <a href="explorer.html">Explorer</a>
    </nav>
  </div>
</header>

<main class="hero">
  <h1 class="hero-title">Ladder Script</h1>
  <p class="hero-lede">A proposal for a new transaction type: v4 RUNG_TX.</p>

<script>
document.getElementById('theme-toggle').addEventListener('click', function () {
  var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('theme', next);
});
</script>
