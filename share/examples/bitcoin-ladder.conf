##
## Ladder Script signet configuration.
##
## To use:
##   cp share/examples/bitcoin-ladder.conf ~/.bitcoin/bitcoin.conf
##   bitcoind -daemon
##
## Then verify with:
##   bitcoin-cli -signet getblockchaininfo
##
## The Ladder Script signet is a private, custom-challenge signet
## maintained at ladder-script.org. The signetchallenge below pins
## this binary to that specific chain — different challenge means
## different chain.
##

# Run on signet (the global toggle).
signet=1

[signet]

# Allow JSON-RPC connections from localhost.
server=1

# Index every transaction so getrawtransaction works for any tx, not
# just wallet ones. Recommended for any signet experimentation.
txindex=1

# Reasonable default fee for wallets that haven't seen enough blocks
# to estimate properly.
fallbackfee=0.0001

# The Ladder Script signet challenge — `51` is OP_TRUE: anyone can
# mine blocks, no key required. Suits a playground signet where the
# seed node is the de-facto canonical miner but anyone is free to
# extend the chain. Don't change this unless you mean to fork off to
# a different chain (different challenge → different genesis).
signetchallenge=51

# Seed peer (Amsterdam). Add more nodes as the network grows.
addnode=85.9.213.194

# RPC credentials. Replace `CHANGE_ME_BEFORE_USING` with a strong
# password before exposing this node beyond localhost. Or use
# `rpcauth` (see `share/rpcauth/rpcauth.py` for the salted-hash form).
rpcuser=ladder
rpcpassword=CHANGE_ME_BEFORE_USING

# Force v1 (legacy) p2p transport. The current seed node only speaks
# v1. Remove this line once the seed is upgraded to support BIP324.
v2transport=0
