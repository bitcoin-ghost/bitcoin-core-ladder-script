name: Release

# Builds binary tarballs from a v*.*.* tag and publishes them as a
# pre-release GitHub Release with PGP-signed SHA256SUMS.
#
# Targets: linux-x86_64, macos-arm64, windows-x86_64 (cross-built
# from Linux via depends/ + mingw-w64).
#
# PGP signing requires two repository secrets:
#   - GPG_PRIVATE_KEY: ASCII-armoured private key (`gpg --armor --export-secret-key <fpr>`)
#   - GPG_PASSPHRASE:  passphrase for the key (omit if unprotected)
# When neither secret is set the SHA256SUMS file is published unsigned.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v30.0-ladder-0.1)'
        required: true

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: Build linux-x86_64
    # Build on the older LTS so the resulting binary's glibc / libstdc++
    # ABI requirements match what users on Ubuntu 22.04 / Debian 12 /
    # WSL2 actually have. ubuntu-24.04 ships glibc 2.39 and gcc-13
    # libstdc++; binaries built there won't run on glibc 2.35 systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkgconf python3 \
            libevent-dev libboost-dev libsqlite3-dev \
            capnproto libcapnp-dev \
            libssl-dev

      - name: Build and install liboqs
        run: |
          git clone --depth 1 --branch 0.10.1 \
            https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cmake -B /tmp/liboqs/build -S /tmp/liboqs -GNinja \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_USE_OPENSSL=OFF \
            -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/liboqs/build
          sudo cmake --install /tmp/liboqs/build
          sudo ldconfig

      - name: Configure
        # BUILD_TX / BUILD_UTIL / BUILD_WALLET_TOOL default to ${BUILD_TESTS},
        # so disabling tests cascades and drops these tools — set them
        # explicitly to keep them in the release tarball.
        # ENABLE_IPC=OFF: ubuntu-22.04 ships capnproto 0.8.0 which has a
        # known CVE; bitcoin's CMake refuses to use it. We don't ship the
        # multiprocess (`bitcoin-node` / IPC) binaries in this release
        # anyway, so disabling IPC is the cleanest path.
        run: |
          cmake -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DBUILD_TX=ON \
            -DBUILD_UTIL=ON \
            -DBUILD_WALLET_TOOL=ON \
            -DENABLE_IPC=OFF \
            -DWITH_ZMQ=OFF

      - name: Build binaries
        run: |
          cmake --build build -j$(nproc) \
            --target bitcoind \
            --target bitcoin-cli \
            --target bitcoin-tx \
            --target bitcoin-util \
            --target bitcoin-wallet

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="bitcoin-core-ladder-${VERSION}-x86_64-linux-gnu"
          mkdir -p "dist/${PKG}/bin" "dist/${PKG}/lib" "dist/${PKG}/share/examples"
          cp build/bin/bitcoind \
             build/bin/bitcoin-cli \
             build/bin/bitcoin-tx \
             build/bin/bitcoin-util \
             build/bin/bitcoin-wallet \
             "dist/${PKG}/bin/"
          # Bundle liboqs.so so the binary is self-contained.
          cp -P /usr/local/lib/liboqs.so* "dist/${PKG}/lib/"
          # Ship the Ladder Script signet conf so users can `cp share/examples/bitcoin-ladder.conf ~/.bitcoin/bitcoin.conf` and just go.
          cp share/examples/bitcoin-ladder.conf "dist/${PKG}/share/examples/"
          strip "dist/${PKG}/bin/"* || true
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}/"
          ls -lh "dist/${PKG}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*.tar.gz
          retention-days: 7

  macos-arm64:
    name: Build macos-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install --quiet \
            cmake ninja pkgconf coreutils \
            boost libevent sqlite3 capnp

      - name: Build and install liboqs
        # Match the Linux job — pin to 0.10.1 from source instead of
        # Homebrew's liboqs (0.13+), which renamed OQS_SIG_alg_dilithium_3
        # → OQS_SIG_alg_ml_dsa_65 and broke pq_verify.cpp.
        run: |
          git clone --depth 1 --branch 0.10.1 \
            https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cmake -B /tmp/liboqs/build -S /tmp/liboqs -GNinja \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_USE_OPENSSL=OFF \
            -DBUILD_SHARED_LIBS=ON
          cmake --build /tmp/liboqs/build
          sudo cmake --install /tmp/liboqs/build

      - name: Configure
        # Point cmake at the Homebrew prefix and our /usr/local liboqs
        # install so both sets of headers/libs are on the search path.
        # Without CMAKE_PREFIX_PATH the brew-only packages (boost,
        # libevent, sqlite3, ...) drop off the include path on arm64.
        run: |
          cmake -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/opt/homebrew;/usr/local" \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DBUILD_TX=ON \
            -DBUILD_UTIL=ON \
            -DBUILD_WALLET_TOOL=ON \
            -DWITH_ZMQ=OFF

      - name: Build binaries
        run: |
          cmake --build build -j$(sysctl -n hw.logicalcpu) \
            --target bitcoind \
            --target bitcoin-cli \
            --target bitcoin-tx \
            --target bitcoin-util \
            --target bitcoin-wallet

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="bitcoin-core-ladder-${VERSION}-arm64-apple-darwin"
          mkdir -p "dist/${PKG}/bin" "dist/${PKG}/lib" "dist/${PKG}/share/examples"
          cp build/bin/bitcoind \
             build/bin/bitcoin-cli \
             build/bin/bitcoin-tx \
             build/bin/bitcoin-util \
             build/bin/bitcoin-wallet \
             "dist/${PKG}/bin/"
          # Bundle liboqs (from /usr/local, not Homebrew) so the binary
          # is self-contained.
          cp -RP /usr/local/lib/liboqs.*dylib "dist/${PKG}/lib/"
          cp share/examples/bitcoin-ladder.conf "dist/${PKG}/share/examples/"
          strip "dist/${PKG}/bin/"* || true
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}/"
          ls -lh "dist/${PKG}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.tar.gz
          retention-days: 7

  windows-x86_64:
    name: Build windows-x86_64 (cross)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: echo "version=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        # mingw-w64 cross toolchain plus everything depends/ needs to
        # build host libraries from source.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkgconf python3 \
            g++-mingw-w64-x86-64-posix \
            mingw-w64-x86-64-dev \
            curl wget bsdmainutils ca-certificates patch xz-utils \
            zip
          # depends/ defaults to the win32 thread model on some Ubuntu
          # versions; force the posix variant which has std::thread.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Cache depends build
        uses: actions/cache@v4
        with:
          path: depends/x86_64-w64-mingw32
          key: depends-mingw-${{ hashFiles('depends/packages/*.mk', 'depends/funcs.mk', 'depends/Makefile') }}

      - name: Build host dependencies (depends/)
        # NO_QT=1 we don't ship a GUI; NO_USDT=1 USDT tracing is Linux-only.
        run: |
          make -C depends HOST=x86_64-w64-mingw32 NO_QT=1 NO_USDT=1 -j$(nproc)

      - name: Cross-compile liboqs to mingw
        # depends/ doesn't ship liboqs; build it ourselves with the same
        # mingw toolchain and install into the depends prefix so cmake
        # finds it via the bitcoin toolchain file.
        run: |
          DEPENDS_PREFIX="$PWD/depends/x86_64-w64-mingw32"
          git clone --depth 1 --branch 0.10.1 \
            https://github.com/open-quantum-safe/liboqs.git /tmp/liboqs
          cat > /tmp/mingw-toolchain.cmake <<EOF
          set(CMAKE_SYSTEM_NAME Windows)
          set(CMAKE_SYSTEM_PROCESSOR x86_64)
          set(CMAKE_C_COMPILER x86_64-w64-mingw32-gcc-posix)
          set(CMAKE_CXX_COMPILER x86_64-w64-mingw32-g++-posix)
          set(CMAKE_RC_COMPILER x86_64-w64-mingw32-windres)
          set(CMAKE_FIND_ROOT_PATH /usr/x86_64-w64-mingw32 ${DEPENDS_PREFIX})
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          EOF
          cmake -B /tmp/liboqs/build -S /tmp/liboqs -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/mingw-toolchain.cmake \
            -DCMAKE_INSTALL_PREFIX="$DEPENDS_PREFIX" \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_USE_OPENSSL=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build /tmp/liboqs/build
          cmake --install /tmp/liboqs/build

      - name: Configure
        run: |
          cmake -B build -GNinja \
            --toolchain depends/x86_64-w64-mingw32/toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DBUILD_TX=ON \
            -DBUILD_UTIL=ON \
            -DBUILD_WALLET_TOOL=ON \
            -DWITH_ZMQ=OFF

      - name: Build binaries
        run: |
          cmake --build build -j$(nproc) \
            --target bitcoind \
            --target bitcoin-cli \
            --target bitcoin-tx \
            --target bitcoin-util \
            --target bitcoin-wallet

      - name: Package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG="bitcoin-core-ladder-${VERSION}-x86_64-w64-mingw32"
          mkdir -p "dist/${PKG}/bin" "dist/${PKG}/share/examples"
          cp share/examples/bitcoin-ladder.conf "dist/${PKG}/share/examples/"
          cp build/bin/bitcoind.exe \
             build/bin/bitcoin-cli.exe \
             build/bin/bitcoin-tx.exe \
             build/bin/bitcoin-util.exe \
             build/bin/bitcoin-wallet.exe \
             "dist/${PKG}/bin/"
          # liboqs was built static (BUILD_SHARED_LIBS=OFF) and linked
          # into bitcoind directly, so no DLL bundle needed.
          x86_64-w64-mingw32-strip "dist/${PKG}/bin/"*.exe || true
          (cd dist && zip -r "${PKG}.zip" "${PKG}/")
          ls -lh "dist/${PKG}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.zip
          retention-days: 7

  publish:
    name: Publish release
    needs: [linux-x86_64, macos-arm64, windows-x86_64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: echo "version=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute SHA256SUMS
        run: |
          mkdir release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv {} release/ \;
          cd release
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: PGP-sign SHA256SUMS
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Import the signing key into a fresh, isolated GnuPG home so we
          # don't leak the private key into the runner's default keyring.
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Detached, ASCII-armoured signature alongside SHA256SUMS.
          echo "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback \
            --passphrase-fd 0 --armor --detach-sign \
            --output release/SHA256SUMS.asc release/SHA256SUMS
          gpg --verify release/SHA256SUMS.asc release/SHA256SUMS
          rm -rf "$GNUPGHOME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES=$(cat <<EOF
          Bitcoin Core + Ladder Script — pre-built binaries for review and
          playground use.

          - Connects to the Ladder Script signet at \`ladder-script.org\`.
          - 805 LOC patched in Bitcoin Core, 19,336 LOC of typed-block library.
          - 65 block types, FALCON-512 / Dilithium3 / SPHINCS+ post-quantum
            signatures, MLSC outputs.

          **This is a reviewer / playground binary, not a production release.**
          Reproducible Guix builds will follow.

          ### Verifying

          \`\`\`
          # 1. Verify the SHA256SUMS file was signed by the release key.
          gpg --verify SHA256SUMS.asc SHA256SUMS

          # 2. Verify the binary archive matches the SHA256SUMS line.
          sha256sum -c SHA256SUMS --ignore-missing
          \`\`\`

          The release-signing key fingerprint is published on
          [ladder-script.org/get-started.html](https://ladder-script.org/get-started.html#download).
          EOF
          )
          gh release create "$VERSION" release/* \
            --title "Bitcoin Core + Ladder Script ${VERSION}" \
            --notes "$NOTES" \
            --prerelease
