name: Ladder Script CI

# Focused on the rung-specific surface — separate from .github/workflows/ci.yml
# which inherits Bitcoin Core's existing CI patterns. This workflow:
#
#   - Builds against the EXACT-pinned liboqs version (LADDER_LIBOQS_VERSION)
#     from upstream source rather than relying on system packages, so the
#     consensus crypto behaviour is identical across runners regardless of
#     distro.
#   - Runs `rung_tests` (boost, 554 cases) plus the rung functional test
#     surface (`feature_rung_tx*`, `feature_rung_pq_batch*`, `feature_qabi*`).
#   - Targets two platforms operators are likely to run on: Linux x86_64
#     (Ubuntu 22.04, the dev/signet env) and macOS arm64 (the M-series Mac
#     deployment story).
#
# Triggers on push to the canonical dev branch + PRs targeting it.

on:
  push:
    branches: [ladder-script]
  pull_request:
    branches: [ladder-script]

env:
  # Must match LADDER_LIBOQS_VERSION in src/rung/CMakeLists.txt
  # AND LADDER_PINNED_LIBOQS_VERSION in src/rung/pq_verify.cpp.
  # Bumping these is a hard fork; see doc/ladder-script/BIP-XXXX.md §FAQ 12.
  LIBOQS_VERSION: "0.10.1"

jobs:
  linux-x86_64:
    name: Linux x86_64 — rung
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libboost-dev libssl-dev libevent-dev \
            python3 python3-pip ccache

      - name: Cache liboqs build
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/liboqs-prefix
          key: liboqs-${{ env.LIBOQS_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build and install liboqs ${{ env.LIBOQS_VERSION }}
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd "${RUNNER_TEMP}"
          curl -sL "https://github.com/open-quantum-safe/liboqs/archive/refs/tags/${LIBOQS_VERSION}.tar.gz" \
            -o liboqs.tar.gz
          tar xzf liboqs.tar.gz
          cd "liboqs-${LIBOQS_VERSION}"
          cmake -GNinja -B build \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/liboqs-prefix" \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_MINIMAL_BUILD="SIG_falcon_512;SIG_falcon_1024;SIG_dilithium_3;SIG_sphincs_sha2_256f_simple"
          cmake --build build -j2
          cmake --install build

      - name: Configure
        run: |
          cmake -GNinja -B build \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/liboqs-prefix" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCH=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=ON \
            -DENABLE_IPC=OFF

      - name: Build bitcoin_rung + test_bitcoin + bitcoind
        run: cmake --build build -j2 --target bitcoin_rung test_bitcoin bitcoind

      - name: Run rung_tests (boost, 554 cases)
        run: build/bin/test_bitcoin --run_test=rung_tests

      - name: Run feature_rung_tx.py
        run: build/test/functional/feature_rung_tx.py

      - name: Run feature_rung_pq_batch.py (locks AUD-01 pre-pass)
        run: build/test/functional/feature_rung_pq_batch.py

      - name: Run feature_rung_pq_batch_stress.py
        run: python3 build/test/functional/feature_rung_pq_batch_stress.py

      - name: Run feature_qabi.py + feature_qabi_size.py
        run: |
          python3 build/test/functional/feature_qabi.py
          python3 build/test/functional/feature_qabi_size.py

      - name: Run feature_rung_anti_embedding.py
        run: build/test/functional/feature_rung_anti_embedding.py

      - name: Run feature_rung_legacy.py
        run: build/test/functional/feature_rung_legacy.py

      - name: Run feature_rung_p2p.py
        run: build/test/functional/feature_rung_p2p.py

      - name: Run feature_rung_descriptor_roundtrip.py
        run: build/test/functional/feature_rung_descriptor_roundtrip.py

  macos-arm64:
    name: macOS arm64 — rung
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Homebrew packages
        env:
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: |
          brew install --quiet python@3 || brew link --overwrite python@3
          brew install --quiet cmake ninja pkgconf boost libevent ccache

      - name: Cache liboqs build
        id: cache-liboqs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/liboqs-prefix
          key: liboqs-${{ env.LIBOQS_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Build and install liboqs ${{ env.LIBOQS_VERSION }}
        if: steps.cache-liboqs.outputs.cache-hit != 'true'
        run: |
          set -euxo pipefail
          cd "${RUNNER_TEMP}"
          curl -sL "https://github.com/open-quantum-safe/liboqs/archive/refs/tags/${LIBOQS_VERSION}.tar.gz" \
            -o liboqs.tar.gz
          tar xzf liboqs.tar.gz
          cd "liboqs-${LIBOQS_VERSION}"
          cmake -GNinja -B build \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/liboqs-prefix" \
            -DOQS_BUILD_ONLY_LIB=ON \
            -DOQS_MINIMAL_BUILD="SIG_falcon_512;SIG_falcon_1024;SIG_dilithium_3;SIG_sphincs_sha2_256f_simple"
          cmake --build build -j2
          cmake --install build

      - name: Configure
        run: |
          cmake -GNinja -B build \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/liboqs-prefix" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_BENCH=OFF \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=ON \
            -DENABLE_IPC=OFF

      - name: Build bitcoin_rung + test_bitcoin + bitcoind
        run: cmake --build build -j2 --target bitcoin_rung test_bitcoin bitcoind

      - name: Run rung_tests (boost, 554 cases)
        run: build/bin/test_bitcoin --run_test=rung_tests

      - name: Run feature_rung_tx.py
        run: build/test/functional/feature_rung_tx.py

      - name: Run feature_rung_pq_batch.py (locks AUD-01 pre-pass)
        run: build/test/functional/feature_rung_pq_batch.py

      - name: Run feature_rung_pq_batch_stress.py
        run: python3 build/test/functional/feature_rung_pq_batch_stress.py

      - name: Run feature_qabi.py + feature_qabi_size.py
        run: |
          python3 build/test/functional/feature_qabi.py
          python3 build/test/functional/feature_qabi_size.py

      - name: Run feature_rung_anti_embedding.py
        run: build/test/functional/feature_rung_anti_embedding.py

      - name: Run feature_rung_legacy.py
        run: build/test/functional/feature_rung_legacy.py

      - name: Run feature_rung_p2p.py
        run: build/test/functional/feature_rung_p2p.py

      - name: Run feature_rung_descriptor_roundtrip.py
        run: build/test/functional/feature_rung_descriptor_roundtrip.py
