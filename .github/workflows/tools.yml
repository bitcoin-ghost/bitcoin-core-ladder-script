name: Tools CI

# Smoke tests for the website/tooling side of the project:
#   - proxy unit tests (FastAPI signet proxy backing /api/ladder/*)
#   - engine smoke test (Node.js script that loads the visual builder)
#   - verify_signet_spends (sanity-check a live /api/ladder/* call)
#
# The heavy Bitcoin Core consensus CI is in ci.yml and is disabled during
# active development (upstream Bitcoin Core matrix is slow). This workflow
# is the lightweight loop that runs on every PR touching tools/proxy/deploy.

on:
  push:
    branches: [ladder-script]
  pull_request:
  workflow_dispatch:

jobs:
  proxy:
    name: Proxy unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install proxy deps
        run: pip install fastapi 'uvicorn[standard]' httpx pytest pytest-asyncio coincurve
      - name: Run proxy tests
        run: python -m pytest proxy/test_proxy.py -v

  engine-smoke:
    name: Engine smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run engine smoke test
        run: node test/tools/engine_smoke.js

  signet-spends:
    name: Verify signet spends
    runs-on: ubuntu-24.04
    # This talks to the live signet at ladder-script.org. Only run on
    # push to ladder-script so we don't hammer the proxy from PR forks.
    if: github.event_name == 'push' && github.ref == 'refs/heads/ladder-script'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify signet spends via public API
        env:
          PROXY_URL: https://ladder-script.org
        run: python test/tools/verify_signet_spends.py
