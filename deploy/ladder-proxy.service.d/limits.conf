# Single-tenant VM (nginx on this same box is the only consumer of the
# proxy). Default 120 rpm chokes the QABIO playground at N >= 10:
# the full ceremony fires ~80 RPCs in tight bursts (3 per participant
# for unprime, 3 for prime, 1 per participant for QABI_SPEND witness)
# and crosses the threshold mid-flow, returning 429 to the playground.
# Bump to 1200 rpm so any reasonable playground walkthrough fits.
[Service]
Environment=RATE_LIMIT_RPM=1200
